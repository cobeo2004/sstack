<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>sstack cockpit</title>
  <link rel="icon" href="data:,">
  <script>
    // Stored theme, applied before the first paint: no flash of the wrong scheme.
    (() => {
      const stored = localStorage.getItem("sstack.theme");
      if (stored === "light" || stored === "dark") document.documentElement.dataset.theme = stored;
    })();
  </script>
  <link rel="stylesheet" href="/ui/tokens.css?t=__TOKEN__">
  <script>
    window.SSTACK = {
      token: "__TOKEN__",
      repo: localStorage.getItem("sstack.repo") || "global"
    };
  </script>
</head>
<body data-page="config">
  <a class="skip" href="#main">Skip to content</a>
  <header class="bench">
    <div class="brand">
      <span class="wordmark">sstack</span>
      <label class="repo-pick">
        <span class="visually-hidden">Repository</span>
        <select id="repo-select"></select>
      </label>
    </div>
    <nav class="pages" aria-label="Pages">
      <button type="button" data-page="config">Config</button>
      <button type="button" data-page="ade">ADE</button>
      <button type="button" data-page="runs">Runs</button>
      <button type="button" data-page="lessons">Lessons</button>
      <button type="button" data-page="wiki">Wiki</button>
      <button type="button" data-page="graph">Graph</button>
    </nav>
    <div class="bench-tools">
      <span id="bench-status" class="bench-status" role="status">127.0.0.1 only</span>
      <button type="button" id="theme-toggle" class="quiet">Dark theme</button>
    </div>
  </header>

  <div id="doctor-banner" class="doctor-banner" role="status" hidden>
    <span>Config changed — run <code>sstack-doctor</code></span>
    <button type="button" id="doctor-dismiss" class="quiet">Dismiss</button>
  </div>

  <div class="shell">
    <aside class="spine" aria-label="Config layers">
      <div class="spine-title">Layers</div>
      <ol id="layer-spine" class="spine-list"></ol>
      <p class="spine-note" id="spine-note">Lowest layer first. The marked layer wins for the selected setting.</p>
    </aside>
    <main id="main" tabindex="-1">
      <section id="page-config" class="page" aria-label="Config"></section>
      <section id="page-ade" class="page" aria-label="ADE"></section>
      <section id="page-runs" class="page" aria-label="Runs"></section>
      <section id="page-lessons" class="page" aria-label="Lessons"></section>
      <section id="page-wiki" class="page" aria-label="Wiki"></section>
      <section id="page-graph" class="page" aria-label="Graph"></section>
    </main>
  </div>

  <footer class="foot">Local dashboard. Every request uses a one-session token.</footer>

  <script type="module">
    try {
      const app = await import(`/ui/app.js?t=${encodeURIComponent(window.SSTACK.token)}`);
      await app.start();
    } catch (err) {
      document.getElementById("main").textContent = `Dashboard failed to load: ${err.message}`;
    }
  </script>
</body>
</html>
