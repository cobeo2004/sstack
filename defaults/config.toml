# sstack profile. Created from <sstack>/defaults by `sstack-config sync`; edit freely (docs/spec/config.md).
# Layout and merge rules: docs/spec/config.md.
ade = "auto"            # auto | none | <adapter name>; SSTACK_ADE overrides

[dispatch]
via = "auto"            # auto | headless | local | ade-cli
timeout_min = 30

[rules]
review_not_implementer = true   # drop any panel member equal to role.implement
max_parallel = 4
loop_guard = 2
auto_escalate = true            # a failed child is retried once, one tier up
tier_order = ["cheap", "standard", "strong"]   # the escalation ladder; tiers not on it don't escalate
panel_diff_lines = 400          # review: a diff bigger than this gets the full panel

[reflect]
auto = false      # true: SessionEnd hook runs a background reflect pass
encode_at = 2     # a lesson seen this many times is proposed as a structural edit

# No tiers ship by default, so kind routing stays off. Add tiers/<name>.toml to turn it on.

[overnight]
merge = "never"                  # never | policy
method = "merge"                 # merge | squash | rebase
merge_min_score = 8              # policy merges only at or above this review score (1..10)
max_diff_lines = 400             # additions + deletions allowed for a policy merge
never_merge = []                 # globs; a PR touching one stays open
merge_with_assumptions = false   # true: merge even when the run decided assumptions
on_question = "decide"           # decide | park
on_stuck = "draft"               # draft | park
stop_at = ""                     # "" or local HH:MM; no new run starts after it

# Unattended mode (docs/spec/config.md): work and setup run with nobody in the thread. Left commented
# so `load()` and `sstack-config sync` are unchanged; code defaults are enabled = false, plan_gate = "inbox".
# [unattended]
# enabled = false                # true = SSTACK_UNATTENDED=1
# plan_gate = "inbox"            # auto | inbox; SSTACK_PLAN_GATE overrides it for one process
