# Conductor. Delegation via CLI/API (beta, needs CONDUCTOR_API_KEY): conductor.hook.
auto = true

[detect]
env = ["CONDUCTOR_SESSION_ID"]

[delegate]
kind = "hook"
readonly = "instructed"
poll_s = 15

[browser]
kind = "none"
summary = ""

[device]
kind = "none"
summary = ""

[capture]
kind = "none"
summary = ""
