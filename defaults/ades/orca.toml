# Orca. Delegation is async (task-create → worker-start, check --wait, collect): orca.hook.
auto = true

[detect]
env = ["ORCA_AGENT_SESSION_ID"]

[delegate]
kind = "hook"
readonly = "instructed"
poll_s = 15

[browser]
kind = "command"
summary = "orca goto/snapshot/click/fill/screenshot (see orca.md)"

[device]
kind = "command"
summary = "orca emulator (iOS; see orca.md)"

[capture]
kind = "command"
summary = "orca screenshot (see orca.md)"
