# Bare Claude Code: the native Agent tool. A fallback: T3, Orca and Conductor run Claude Code too, and win.
auto = true
fallback = true                   # tried after every other adapter (docs/spec/ade.md)

[detect]
env = ["CLAUDECODE"]

[delegate]
kind = "tool"
name = "Agent"
load_hint = "built in"
readonly = "instructed"

[delegate.args]
description = "{title}"
prompt = "{task}"                 # sstack_ade.TASK
model = "{model}"
subagent_type = "general-purpose"

[delegate.write_args]             # merged over args for write roles (implement)
isolation = "worktree"

[delegate.shell]                  # a member whose harness is not in [providers]: this tool runs its headless command
name = "Bash"
load_hint = "built in"

[delegate.shell.args]
command = "{command}"
run_in_background = true          # the agent is told when it ends; Bash itself stops at 10 minutes
description = "{title}"

[providers]                       # harnesses the Agent tool can start
claude = "claude"

[models.claude]                   # sstack model alias → Agent `model`
haiku = "haiku"
sonnet = "sonnet"
opus = "opus"
fable = "fable"

[effort_option]
claude = "effort"

[browser]
kind = "none"
summary = ""

[device]
kind = "none"
summary = ""

[capture]
kind = "none"
summary = ""
