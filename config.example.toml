# sstack global config — copy to ~/.sstack/config.toml (sstack-install does this).
# Layers: ~/.sstack/config.toml → <git root>/.sstack/config.toml → <git root>/.sstack/config.local.toml
# [role.X], [harness.X], [project] are replaced whole; other tables merge key by key.
# Placeholders whose value is unset are dropped together with their flag.

[harness.pi]
headless = ["pi", "-p", "--no-session", "--model", "{model}", "--thinking", "{effort}"]
headless_readonly = ["pi", "-p", "--no-session", "--model", "{model}", "--thinking", "{effort}", "--tools", "read,grep,find,ls"]
t3_provider = "pi"

[harness.codex]
headless = ["codex", "exec", "--sandbox", "workspace-write", "-m", "{model}", "-c", "model_reasoning_effort={effort}", "-"]
headless_readonly = ["codex", "exec", "--sandbox", "read-only", "-m", "{model}", "-c", "model_reasoning_effort={effort}", "-"]
t3_provider = "codex"

[harness.claude]
headless = ["claude", "-p", "--model", "{model}", "--permission-mode", "acceptEdits"]
headless_readonly = ["claude", "-p", "--model", "{model}", "--permission-mode", "plan"]
t3_provider = "claudeAgent"

[harness.cursor]
headless = ["cursor-agent", "-p", "--force", "--model", "{model}"]
t3_provider = "cursor"

[transport]
mode = "auto"            # auto | thread | headless | local
timeout_min = 30

[transport.t3]
detect = "T3CODE_THREAD_ID"          # env var present inside T3 Code
cli = "$T3CODE_CLI_PATH"             # falls back to ~/.t3/bin/t3
cmd = ["{cli}", "thread", "start", "--provider", "{provider}", "--model", "{model}",
       "--title", "{title}", "--wait", ".", "-"]

# Tiers: named agents that work kinds route to automatically (sstack-dispatch routes).
# Any name works ([tier.ui-fast], [tier.local-gpu]); delete every [tier.*] to turn kind routing off.
[tier.strong]
harness = "codex"
model = "gpt-6.1-sol"
effort = "high"

[tier.standard]
harness = "claude"
model = "sonnet"

[tier.cheap]
harness = "pi"
model = "opencode-go/deepseek-v4.1-flash"
effort = "high"

[role.scout]
harness = "claude"
model = "haiku"

[role.implement]
harness = "pi"
model = "opencode-go/deepseek-v4.1-flash"
effort = "high"

# Remap built-in kinds to your tiers, or add kind names usable with --hint:
# [routing.kinds]
# frontend = "ui-fast"
# data = "local-gpu"

# Optional overrides, checked before the built-in kinds: --hint <name>, or `paths` match.
# [role.implement.hint.ui]
# when = "our web app"          # shown by `sstack-dispatch routes`
# paths = ["web/*"]
# harness = "claude"
# model = "opus"                 # or: tier = "strong"

[role.review]
mode = "auto"    # auto: one reviewer, full panel for security/complex kinds or big diffs | single | panel
panel = [
  { harness = "codex",  model = "gpt-6.1-sol", effort = "high" },
  { harness = "claude", model = "opus" },
]

[rules]
review_not_implementer = true   # drop any panel member equal to role.implement
max_parallel = 4
loop_guard = 2
auto_escalate = true            # a failed child is retried once, one tier up
tier_order = ["cheap", "standard", "strong"]   # the escalation ladder; tiers not on it don't escalate
panel_diff_lines = 400          # review: a diff bigger than this gets the full panel

[reflect]
auto = false      # true: SessionEnd hook runs a background reflect pass
encode_at = 2     # a lesson seen this many times is proposed as a structural edit
